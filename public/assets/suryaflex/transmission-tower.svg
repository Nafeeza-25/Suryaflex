<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 160" width="140" height="160">
  <defs>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="70" cy="150" rx="45" ry="6" fill="#04121b" opacity="0.8" />

  <!-- Transmission Pylon Main Lattice Tower Structure -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)">
    <!-- Tower Main Legs -->
    <path d="M 70 15 L 30 145 M 70 15 L 110 145" />

    <!-- Center Spine -->
    <line x1="70" y1="15" x2="70" y2="145" stroke="#1d4d68" stroke-width="1.5" />

    <!-- Horizontal Lattice Cross-members -->
    <line x1="62" y1="40" x2="78" y2="40" />
    <line x1="52" y1="65" x2="88" y2="65" />
    <line x1="42" y1="95" x2="98" y2="95" />
    <line x1="34" y1="125" x2="106" y2="125" />

    <!-- Cross Diagonal Bracing -->
    <line x1="62" y1="40" x2="78" y2="65" stroke-width="1.2" opacity="0.8" />
    <line x1="78" y1="40" x2="62" y2="65" stroke-width="1.2" opacity="0.8" />

    <line x1="52" y1="65" x2="88" y2="95" stroke-width="1.2" opacity="0.8" />
    <line x1="88" y1="65" x2="52" y2="95" stroke-width="1.2" opacity="0.8" />

    <line x1="42" y1="95" x2="98" y2="125" stroke-width="1.2" opacity="0.8" />
    <line x1="98" y1="95" x2="42" y2="125" stroke-width="1.2" opacity="0.8" />

    <!-- Top Crossarm Wings -->
    <line x1="20" y1="40" x2="120" y2="40" stroke-width="2.5" />
    <line x1="10" y1="65" x2="130" y2="65" stroke-width="2.5" />
    <line x1="25" y1="95" x2="115" y2="95" stroke-width="2" />
  </g>

  <!-- Insulator Bells Hanging on Arms -->
  <g fill="#0ea5e9" stroke="#38bdf8" stroke-width="1">
    <circle cx="20" cy="46" r="3" />
    <circle cx="120" cy="46" r="3" />
    <circle cx="10" cy="71" r="3" />
    <circle cx="130" cy="71" r="3" />
    <circle cx="25" cy="101" r="3" />
    <circle cx="115" cy="101" r="3" />
  </g>

  <!-- Top Beacon Light -->
  <circle cx="70" cy="12" r="3" fill="#ef4444" />
</svg>
