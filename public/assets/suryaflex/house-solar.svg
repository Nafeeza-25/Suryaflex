<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 140" width="160" height="140">
  <defs>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4558" />
      <stop offset="100%" stop-color="#182d3b" />
    </linearGradient>
    <linearGradient id="pvGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#163246" />
      <stop offset="100%" stop-color="#0c1f2d" />
    </linearGradient>
    <filter id="solarGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Lawn Base Shadow -->
  <ellipse cx="80" cy="128" rx="72" ry="10" fill="#04121b" opacity="0.8" />
  <ellipse cx="80" cy="126" rx="68" ry="8" fill="#13362a" opacity="0.6" />

  <!-- House Main Body -->
  <path d="M 28 65 L 80 32 L 132 65 L 132 118 L 28 118 Z" fill="url(#wallGrad)" stroke="#224761" stroke-width="2" />

  <!-- Front Door & Windows -->
  <rect x="70" y="82" width="20" height="36" rx="2" fill="#08141e" stroke="#33617e" stroke-width="1.5" />
  <circle cx="86" cy="100" r="1.5" fill="#f4ba47" />

  <!-- Left Window -->
  <rect x="40" y="76" width="20" height="20" rx="3" fill="#102e42" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="50" y1="76" x2="50" y2="96" stroke="#23506e" stroke-width="1" />
  <line x1="40" y1="86" x2="60" y2="86" stroke="#23506e" stroke-width="1" />

  <!-- Right Window -->
  <rect x="100" y="76" width="20" height="20" rx="3" fill="#102e42" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="110" y1="76" x2="110" y2="96" stroke="#23506e" stroke-width="1" />
  <line x1="100" y1="86" x2="120" y2="86" stroke="#23506e" stroke-width="1" />

  <!-- Roof Structure -->
  <path d="M 22 66 L 80 28 L 138 66 L 128 72 L 80 38 L 32 72 Z" fill="url(#roofGrad)" stroke="#396582" stroke-width="1.5" />

  <!-- Blue Rooftop Solar Panels Grid -->
  <g filter="url(#solarGlow)">
    <!-- Main Left Panel -->
    <polygon points="38,62 76,36 76,58 38,82" fill="url(#pvGrad)" stroke="#7dd3fc" stroke-width="1" />
    <line x1="57" y1="49" x2="57" y2="70" stroke="#bae6fd" stroke-width="0.8" opacity="0.8" />
    <line x1="47" y1="56" x2="66" y2="43" stroke="#bae6fd" stroke-width="0.8" opacity="0.8" />
    <line x1="47" y1="67" x2="66" y2="54" stroke="#bae6fd" stroke-width="0.8" opacity="0.8" />

    <!-- Main Right Panel -->
    <polygon points="84,36 122,62 122,82 84,58" fill="url(#pvGrad)" stroke="#7dd3fc" stroke-width="1" />
    <line x1="103" y1="49" x2="103" y2="70" stroke="#bae6fd" stroke-width="0.8" opacity="0.8" />
    <line x1="94" y1="43" x2="113" y2="56" stroke="#bae6fd" stroke-width="0.8" opacity="0.8" />
    <line x1="94" y1="54" x2="113" y2="67" stroke="#bae6fd" stroke-width="0.8" opacity="0.8" />
  </g>
</svg>
